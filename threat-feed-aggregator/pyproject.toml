[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "C",  # complexity
    "I",  # isort
    "B",  # bugbear
    "UP", # pyupgrade
    "TID", # flake8-tidy-imports
    "PERF", # perflint
    "N" # pep8-naming
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "TID252", # Relative imports — standard pattern for this package
    "C901",   # Complex structure — refactoring out of scope for lint
    "E402",   # Module-level import not at top — intentional lazy imports
    "N806",   # Non-lowercase variable in function — used for constants (DB_TYPE, etc.)
    "N802",   # Invalid function name — compatibility with external APIs
    "N817",   # CamelCase imported as acronym
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
targets = ["threat_feed_aggregator/"]
exclude_dirs = ["tests", "venv"]
skips = [
    "B101", "B104", "B105", "B404", "B603", "B607", "B703", "B506", "B301",
    "B608", # SQL string construction — false positives on parameterized f-string queries
]