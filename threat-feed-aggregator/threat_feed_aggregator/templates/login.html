{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block extra_head %}
<style>
    body { background: var(--surface-0) !important; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .main-container { padding: 0 !important; }
    .login-card {
        width: 400px;
        border: 1px solid var(--border-color);
        border-radius: 1.5rem;
        overflow: hidden;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.4);
        background: var(--surface-1);
    }
    .login-card .card-header {
        background: var(--surface-2);
        border-bottom: 1px solid var(--border-color);
    }
    .login-card .form-label-custom {
        color: var(--text-secondary);
    }
    .login-card .form-control {
        background: var(--surface-2);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
    }
    .login-card .form-control::placeholder {
        color: var(--text-muted);
    }
    .login-card .form-control:focus {
        background: var(--surface-2);
        border-color: var(--accent-primary);
        color: var(--text-primary);
        box-shadow: 0 0 0 0.2rem rgba(0, 229, 255, 0.15);
    }
    .login-card .input-group-text {
        background: var(--surface-2);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
    }
    .login-card .btn-login {
        background: var(--accent-primary);
        color: var(--text-inverse);
        border: none;
        font-weight: 600;
        font-family: 'IBM Plex Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .login-card .btn-login:hover {
        background: #00c4db;
        color: var(--text-inverse);
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center w-100 h-100">
    <div class="card login-card">
        <div class="card-header text-center py-4 border-0">
            <div class="mb-2"><i class="fas fa-shield-virus fa-3x" style="color: var(--accent-primary);"></i></div>
            <h4 class="fw-bold mb-0" style="color: var(--text-primary); font-family: 'IBM Plex Mono', monospace;">ThreatFeed Access</h4>
            <p class="small mb-0" style="color: var(--text-muted);">Intelligence Engine v{{ version }}</p>
        </div>
        <div class="card-body px-4 pb-5">
            <form action="{{ url_for('auth.login') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label-custom">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label-custom">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-login btn-lg shadow-sm">
                        Sign In <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
