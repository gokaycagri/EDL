name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Get the previous tag for changelog generation
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          echo "prev_tag=${PREV_TAG:-}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        working-directory: ./threat-feed-aggregator
        run: |
          SOURCE_VERSION=$(python -c "from threat_feed_aggregator.version import __version__; print(__version__)")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "${SOURCE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Version mismatch! version.py=${SOURCE_VERSION} but tag=${TAG_VERSION}"
            echo "Update version.py to match the tag before releasing."
            exit 1
          fi
          echo "Version verified: ${SOURCE_VERSION}"

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV="${{ steps.version.outputs.prev_tag }}"
          TAG="${{ steps.version.outputs.tag }}"
          if [ -z "${PREV}" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..${TAG}"
          fi
          # Generate categorized changelog from conventional commits
          {
            echo "## What's Changed"
            echo ""
            # Features
            FEATS=$(git log "${RANGE}" --pretty=format:"- %s" --grep="^feat" --no-merges 2>/dev/null || true)
            if [ -n "${FEATS}" ]; then
              echo "### Features"
              echo "${FEATS}"
              echo ""
            fi
            # Fixes
            FIXES=$(git log "${RANGE}" --pretty=format:"- %s" --grep="^fix" --no-merges 2>/dev/null || true)
            if [ -n "${FIXES}" ]; then
              echo "### Bug Fixes"
              echo "${FIXES}"
              echo ""
            fi
            # Security
            SECS=$(git log "${RANGE}" --pretty=format:"- %s" --grep="^security\|^sec" --no-merges 2>/dev/null || true)
            if [ -n "${SECS}" ]; then
              echo "### Security"
              echo "${SECS}"
              echo ""
            fi
            # Other changes
            OTHERS=$(git log "${RANGE}" --pretty=format:"- %s" --no-merges --invert-grep --grep="^feat" --grep="^fix" --grep="^security" --grep="^sec" 2>/dev/null | head -20 || true)
            if [ -n "${OTHERS}" ]; then
              echo "### Other Changes"
              echo "${OTHERS}"
              echo ""
            fi
            echo "---"
            echo "**Docker Image:** \`ghcr.io/${{ github.repository_owner }}/edl:${{ steps.version.outputs.tag }}\`"
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
