name: Threat Feed Aggregator CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/edl

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install linting tools
      run: pip install ruff bandit

    - name: Ruff lint check
      working-directory: ./threat-feed-aggregator
      run: ruff check threat_feed_aggregator/

    - name: Bandit security scan
      working-directory: ./threat-feed-aggregator
      run: bandit -r threat_feed_aggregator/ -c pyproject.toml --severity-level medium

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev whois libjpeg-dev zlib1g-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pytest pytest-cov
        pip install -r threat-feed-aggregator/requirements.txt

    - name: Verify Flask installation
      working-directory: ./threat-feed-aggregator
      run: |
        python -c "import sys, flask, flask.sessions, flask_session; print('Flask:', flask.__version__, flask.__file__); print('flask.sessions OK:', flask.sessions.__file__); print('flask_session:', flask_session.__version__, flask_session.__file__)"

    - name: Run Unit Tests with Coverage
      working-directory: ./threat-feed-aggregator
      run: |
        python -m pytest tests/ --import-mode=importlib --junitxml=junit/test-results.xml --cov=threat_feed_aggregator --cov-report=term-missing -v --tb=short

    - name: Run ITAI Contract Tests
      working-directory: ./threat-feed-aggregator
      run: |
        python -m pytest tests/test_contract.py tests/test_sso.py tests/test_manifest_compat.py --import-mode=importlib -v --tb=short

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    outputs:
      new_release: ${{ steps.bump.outputs.new_release }}
      app_version: ${{ steps.bump.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Auto-bump version from commits
        id: bump
        working-directory: ./threat-feed-aggregator
        run: |
          # Skip if last commit is a version bump (prevent infinite loop)
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "${LAST_MSG}" == chore\(release\):* ]]; then
            echo "Last commit is a release bump — skipping."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read current version
          CUR=$(python -c "from threat_feed_aggregator.version import __version__; print(__version__)")
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CUR}"

          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "${PREV_TAG}" ]; then
            echo "No previous tag — skipping auto-bump."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count new commits since last tag (exclude release bumps)
          NEW_COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline --no-decorate --invert-grep --grep="^chore(release):" | wc -l)
          if [ "${NEW_COMMITS}" -eq 0 ]; then
            echo "No new commits since ${PREV_TAG} — skipping."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump type from commit messages
          COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=%s --no-decorate)
          if echo "${COMMITS}" | grep -qiE "BREAKING CHANGE|^[a-z]+(\(.+\))?!:"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            BUMP="major"
          elif echo "${COMMITS}" | grep -qE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0
            BUMP="minor"
          else
            PATCH=$((PATCH + 1))
            BUMP="patch"
          fi

          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${NEW_VER}"

          # Check if tag already exists
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Bump: ${BUMP} (${CUR} → ${NEW_VER})"
          echo "new_release=true" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          # Update version.py
          echo "__version__ = '${NEW_VER}'" > threat_feed_aggregator/version.py

      - name: Generate release notes
        if: steps.bump.outputs.new_release == 'true'
        id: notes
        run: |
          CHANGELOG=$(git log "${{ steps.bump.outputs.prev_tag }}..HEAD" --oneline --no-decorate --invert-grep --grep="^chore(release):")
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "changelog<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "${CHANGELOG}" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump, tag, and release
        if: steps.bump.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threat-feed-aggregator/threat_feed_aggregator/version.py
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:master --follow-tags
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --notes "## Changes since ${{ steps.bump.outputs.prev_tag }}

          ${{ steps.notes.outputs.changelog }}

          ---
          **Docker image:** \`ghcr.io/${{ github.repository_owner }}/edl:${{ steps.bump.outputs.new_version }}\`"

  publish:
    runs-on: ubuntu-latest
    needs: [test, release]
    if: always() && needs.test.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from source
        id: version
        working-directory: ./threat-feed-aggregator
        run: |
          APP_VERSION=$(python -c "from threat_feed_aggregator.version import __version__; print(__version__)")
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Determine Docker tags
        id: tags
        run: |
          TAGS="${REGISTRY}/${IMAGE_NAME}:latest"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.app_version }}"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${{ steps.version.outputs.short_sha }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./threat-feed-aggregator
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}
