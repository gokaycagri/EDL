name: Threat Feed Aggregator CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/edl

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install linting tools
      run: pip install ruff bandit

    - name: Ruff lint check
      working-directory: ./threat-feed-aggregator
      run: ruff check threat_feed_aggregator/

    - name: Bandit security scan
      working-directory: ./threat-feed-aggregator
      run: bandit -r threat_feed_aggregator/ -c pyproject.toml --severity-level medium

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev whois libjpeg-dev zlib1g-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pytest pytest-cov
        pip install -r threat-feed-aggregator/requirements.txt

    - name: Verify Flask installation
      working-directory: ./threat-feed-aggregator
      run: |
        python -c "import sys, flask, flask.sessions, flask_session; print('Flask:', flask.__version__, flask.__file__); print('flask.sessions OK:', flask.sessions.__file__); print('flask_session:', flask_session.__version__, flask_session.__file__)"

    - name: Run Unit Tests with Coverage
      working-directory: ./threat-feed-aggregator
      run: |
        python -m pytest tests/ --import-mode=importlib --junitxml=junit/test-results.xml --cov=threat_feed_aggregator --cov-report=term-missing -v --tb=short

    - name: Run ITAI Contract Tests
      working-directory: ./threat-feed-aggregator
      run: |
        python -m pytest tests/test_contract.py tests/test_sso.py tests/test_manifest_compat.py --import-mode=importlib -v --tb=short

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      app_version: ${{ steps.check.outputs.app_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check if version changed
        id: check
        working-directory: ./threat-feed-aggregator
        run: |
          APP_VERSION=$(python -c "from threat_feed_aggregator.version import __version__; print(__version__)")
          TAG="v${APP_VERSION}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping release."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: ${TAG}"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.check.outputs.new_release == 'true'
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "${PREV_TAG}" ]; then
            CHANGELOG=$(git log --oneline --no-decorate | head -50)
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-decorate)
          fi
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "changelog<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "${CHANGELOG}" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.check.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"
          gh release create "${{ steps.check.outputs.tag }}" \
            --title "${{ steps.check.outputs.tag }}" \
            --notes "## Changes since previous release

          ${{ steps.notes.outputs.changelog }}

          ---
          **Docker image:** \`ghcr.io/${{ github.repository_owner }}/edl:${{ steps.check.outputs.app_version }}\`"

  publish:
    runs-on: ubuntu-latest
    needs: [test, release]
    if: always() && needs.test.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from source
        id: version
        working-directory: ./threat-feed-aggregator
        run: |
          APP_VERSION=$(python -c "from threat_feed_aggregator.version import __version__; print(__version__)")
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Determine Docker tags
        id: tags
        run: |
          TAGS="${REGISTRY}/${IMAGE_NAME}:latest"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.app_version }}"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${{ steps.version.outputs.short_sha }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./threat-feed-aggregator
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}
