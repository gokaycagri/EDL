name: Threat Feed Aggregator CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install linting tools
      run: pip install ruff bandit

    - name: Ruff lint check
      working-directory: ./threat-feed-aggregator
      run: ruff check threat_feed_aggregator/

    - name: Bandit security scan
      working-directory: ./threat-feed-aggregator
      run: bandit -r threat_feed_aggregator/ -c pyproject.toml --severity-level medium

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev whois

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f threat-feed-aggregator/requirements.txt ]; then pip install -r threat-feed-aggregator/requirements.txt; fi

    - name: Run Unit Tests with Coverage
      working-directory: ./threat-feed-aggregator
      run: |
        python -m pytest tests/ --junitxml=junit/test-results.xml --cov=threat_feed_aggregator --cov-report=term-missing -v --tb=short

    - name: Run ITAI Contract Tests
      working-directory: ./threat-feed-aggregator
      run: |
        python -m pytest tests/test_contract.py tests/test_sso.py tests/test_manifest_compat.py -v --tb=short
