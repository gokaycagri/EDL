# --- 2. Storage (PVCs) ---
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: postgres-data
  spec:
    storageClassName: ocs-storagecluster-ceph-rbd
    accessModes: [ "ReadWriteOnce" ]
    resources:
      requests:
        storage: 5Gi

- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: redis-data
  spec:
    storageClassName: ocs-storagecluster-ceph-rbd
    accessModes: [ "ReadWriteOnce" ]
    resources:
      requests:
        storage: 1Gi

- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: app-data
  spec:
    storageClassName: ocs-storagecluster-ceph-rbd
    accessModes: [ "ReadWriteOnce" ]
    resources:
      requests:
        storage: 2Gi

# --- 3. Postgres ---
- apiVersion: v1
  kind: Service
  metadata:
    name: postgres
  spec:
    ports:
    - port: 5432
      targetPort: 5432
    selector:
      name: postgres

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: postgres
  spec:
    selector:
      matchLabels:
        name: postgres
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          name: postgres
      spec:
        imagePullSecrets:
        - name: quay-pull-secret
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: postgres
          image: quay.mfa.gov.tr/nsm/postgres:edl
          env:
            - name: POSTGRES_DB
              value: "threat_feed"
            - name: POSTGRES_USER
              value: "threat_user"
            - name: POSTGRES_PASSWORD
              value: "secure_password"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "threat_user", "-d", "threat_feed"]
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe: # VERİTABANI HAZIR OLMADAN TRAFİK GÖNDERME
            exec:
              command: ["pg_isready", "-U", "threat_user", "-d", "threat_feed"]
            initialDelaySeconds: 5
            timeoutSeconds: 5
        volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

# --- 4. Redis ---
- apiVersion: v1
  kind: Service
  metadata:
    name: redis
  spec:
    ports:
    - port: 6379
      targetPort: 6379
    selector:
      name: redis

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: redis
  spec:
    selector:
      matchLabels:
        name: redis
    template:
      metadata:
        labels:
          name: redis
      spec:
        imagePullSecrets:
        - name: quay-pull-secret
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: redis
          image: quay.mfa.gov.tr/nsm/redis:edl
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: redis-data
              mountPath: /data
        volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data

# --- 5. Threat Feed Aggregator ---
- apiVersion: v1
  kind: Service
  metadata:
    name: threat-feed-aggregator
  spec:
    ports:
    - port: 8080
      targetPort: 8080
      name: https
    selector:
      name: threat-feed-aggregator

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: threat-feed-aggregator
  spec:
    replicas: 1
    selector:
      matchLabels:
        name: threat-feed-aggregator
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          name: threat-feed-aggregator
      spec:
        imagePullSecrets:
        - name: quay-pull-secret
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        initContainers: # POSTGRES HAZIR OLANA KADAR BEKLE (KRİTİK)
        - name: wait-for-postgres
          image: quay.mfa.gov.tr/nsm/postgres:edl
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U threat_user; do echo waiting for postgres; sleep 2; done;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
        containers:
        - name: threat-feed-aggregator
          image: quay.mfa.gov.tr/nsm/aggregator:edl
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SECRET_KEY
              value: "edl_secret_production_key"
            - name: ADMIN_PASSWORD
              value: "123456"
            - name: DB_TYPE
              value: "postgres"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "threat_feed"
            - name: DB_USER
              value: "threat_user"
            - name: DB_PASS
              value: "secure_password"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: app-data
              mountPath: /app/threat_feed_aggregator/data
          livenessProbe:
            exec:
              command: ["curl", "-f", "-k", "https://localhost:8080/login"]
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["curl", "-f", "-k", "https://localhost:8080/login"]
            initialDelaySeconds: 30
            periodSeconds: 10
        volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data

# --- 6. OpenShift Route ---
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: threat-feed-aggregator
  spec:
    to:
      kind: Service
      name: threat-feed-aggregator
    port:
      targetPort: 8080
    tls:
      termination: passthrough
      insecureEdgeTerminationPolicy: Redirect
